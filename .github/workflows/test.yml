name: Tests

on:
  push:
    branches:
      - main
      - claude/**
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r apps/superdirector/requirements.txt
          python -m pip install groq python-Levenshtein numpy
      - name: Validate plugin packaging
        run: python scripts/validate_plugin.py
      - name: Run superdirector tests
        run: python -m pytest apps/superdirector/tests -q --tb=short
      - name: Run HotMic module tests
        run: |
          python -m pytest apps/review-engine/tests -q --tb=short
          python -m pytest apps/script-creator/tests -q --tb=short
          python -m pytest apps/video-cutter/tests -q --tb=short
